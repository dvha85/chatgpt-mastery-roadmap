name: Vietnamese-first content migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vietnamese-first-migration-20260911.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Vietnamese-first learning policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def append_once(path, marker, addition):
              text = read(path)
              if addition.strip() in text:
                  return
              if marker not in text:
                  raise SystemExit(f'Marker not found in {path}: {marker!r}')
              write(path, text.replace(marker, marker + addition, 1))

          policy = '''# Vietnamese-first Usage — Quy ước dùng ChatGPT bằng tiếng Việt

> Áp dụng cho prompt, task brief, ví dụ hội thoại, bài thực hành và đáp án trong roadmap này.

## Nguyên tắc chính

Repo vẫn **song ngữ English–Tiếng Việt** để học thuật ngữ và đọc tài liệu AI, nhưng **ngôn ngữ vận hành mặc định là tiếng Việt**.

- Prompt để copy/paste vào ChatGPT: **tiếng Việt trước**.
- Task brief / bản giao việc: **tiếng Việt trước**.
- Ví dụ câu hỏi của người dùng và yêu cầu kiểm chứng: **tiếng Việt trước**.
- Kết quả mong đợi từ ChatGPT: mặc định **trả lời bằng tiếng Việt**, trừ bài luyện tiếng Anh.
- Bản tiếng Anh nếu hữu ích được đặt ở phần **English reference / Tham khảo tiếng Anh** hoặc **English exercise / Bài luyện tiếng Anh**; không bắt buộc phải dùng tiếng Anh để hoàn thành ChatGPT track.
- Tên sản phẩm, thuật ngữ kỹ thuật chuẩn như `prompt`, `context`, `tool`, `model`, `token`, `API`, `repository`, `commit` vẫn giữ tiếng Anh và phải được giải thích bằng tiếng Việt khi xuất hiện lần đầu.
- Không dịch tên file, lệnh terminal, code identifier, API field hoặc cú pháp kỹ thuật nếu việc dịch làm sai thao tác.

## Mẫu prompt vận hành mặc định

```text
Kết quả cần đạt: ...
Ngữ cảnh: ...
Công cụ hoặc nguồn cần dùng: ...
Dạng đầu ra: ...
Ranh giới: ...
Tiêu chí chấp nhận: ...
Cách kiểm chứng: ...
Ngôn ngữ đầu ra: Tiếng Việt.
```

Không cần điền tất cả dòng cho task đơn giản. Mục tiêu là rõ việc, rõ dữ kiện, rõ giới hạn và rõ cách kiểm.

## Tách hai track học

### ChatGPT track

Người học được phép dùng **100% tiếng Việt** để giao việc, phân tích, kiểm chứng và tạo sản phẩm. PASS dựa trên khả năng dùng ChatGPT đúng, không dựa trên khả năng viết prompt tiếng Anh.

### English track

Tiếng Anh được luyện riêng thông qua:

- key vocabulary / từ vựng trọng tâm;
- English patterns / mẫu câu tiếng Anh;
- đọc đoạn tài liệu ngắn;
- viết một vài câu tiếng Anh có kiểm soát.

English track hỗ trợ việc đọc tài liệu AI chính thức, nhưng không thay thế ngôn ngữ vận hành tiếng Việt.

## Quy tắc cho người biên soạn lesson mới

1. Mọi prompt thực hành phải có bản tiếng Việt hoàn chỉnh và dùng được ngay.
2. Nếu thêm bản tiếng Anh, đặt sau bản tiếng Việt và ghi rõ đó là tham khảo/luyện tiếng Anh.
3. Không đặt nhãn `English prompt` làm prompt chính của ví dụ.
4. Bài ChatGPT exercise dùng tiếng Việt; bài English exercise mới yêu cầu tiếng Anh.
5. Khi prompt có code, command hoặc tên kỹ thuật, giữ nguyên phần kỹ thuật và viết phần hướng dẫn xung quanh bằng tiếng Việt.
6. QA phải kiểm tra người mới có thể hoàn thành ChatGPT track mà không cần tự dịch prompt sang tiếng Việt.
'''
